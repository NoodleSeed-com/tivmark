server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # The site's one Content-Security-Policy.
  #
  # It lives here rather than in a <meta http-equiv> tag because a header is what `curl -I`
  # and CI can read back, and because `frame-ancestors` is ignored in a meta tag. Policies
  # combine restrictively, so a second copy in the HTML would silently intersect with this
  # one -- there must only ever be this one.
  #
  # Only the Noodle service origin now: the legacy share-code widget is gone, so every
  # app.noodleseed.com and *.mcp.noodleseed.com allowance it needed went with it.
  # script-src matters most: if it blocks the embed script, no widget code runs at all, so
  # nothing on the page can report the failure.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.noodleseed.dev; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; frame-src 'self' https://cloud.noodleseed.dev; child-src 'self' https://cloud.noodleseed.dev; worker-src 'self' blob:; connect-src 'self' https://cloud.noodleseed.dev https://fonts.googleapis.com https://fonts.gstatic.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  location / {
    # The document must revalidate on every load: with no cache header, browsers
    # heuristically cache index.html and keep running a stale page for hours after a
    # deploy (observed in production -- a just-shipped stylesheet was absent from the
    # served-from-cache document). `expires -1` emits Cache-Control: no-cache without
    # using add_header, so the security headers inherited from the server block survive.
    expires -1;
    # This is a static site, not a single-page app. The previous `/index.html` fallback made
    # every URL answer 200 with the home page -- so there were no 404s at all, which is bad
    # for search engines and makes a crawler index the same document under unbounded URLs.
    # `$uri.html` is what maps /privacy onto privacy.html.
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
    # `expires` rather than `add_header Cache-Control`: add_header is not additive across
    # levels, so declaring one here would drop every security header inherited from the
    # server block. `expires` sets Cache-Control without that side effect.
    #
    # Deliberately not `immutable` -- these filenames are not content-hashed, so a replaced
    # image must be allowed to revalidate rather than being pinned for a month.
    expires 30d;
    try_files $uri =404;
  }
}
