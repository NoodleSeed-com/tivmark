name: Deploy web to GCP

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: tivmark-app
  GCP_REGION: us-central1
  ARTIFACT_REPOSITORY: tivmark
  SERVICE_NAME: tivmark-web
  IMAGE_NAME: web
  CLOUD_SQL_CONNECTION_NAME: tivmark-app:us-central1:tivmark-app-db
  ONBOARDING_RESEARCH_QUEUE: onboarding-research
  ONBOARDING_RESEARCH_SERVICE_ACCOUNT: onboarding-research@tivmark-app.iam.gserviceaccount.com
  ONBOARDING_RESEARCH_MODEL: gemini-flash-latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 to match the Docker runtime (node:24-alpine).
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
          check-latest: true

      - name: Validate web app
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXTAUTH_URL: http://localhost:4002
          NEXTAUTH_SECRET: secret
          NEXTAUTH_SESSION_STRATEGY: jwt
          APP_URL: http://localhost:4002
        run: |
          npm ci
          npm run check-lint
          npm run check-format
          npm run check-locale
          npm run check-api-first
          npm run openapi:check
          npm run test
          npm run build-ci

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # Provision this bounded queue and workload IAM separately before enabling the release.
      # Refuse to deploy a UI advertising research when its durable delivery queue is missing.
      - name: Verify onboarding research queue
        run: |
          QUEUE_STATE="$(gcloud tasks queues describe "${ONBOARDING_RESEARCH_QUEUE}" \
            --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" --format='value(state)')"
          test "${QUEUE_STATE}" = RUNNING

      # Apply schema.prisma to the prod Cloud SQL DB. This repo manages schema via `db push`
      # (prisma/migrations/ is frozen at 2024), and nothing else in the deploy path syncs the DB —
      # so without this a new model 500s in prod with "table does not exist". Runs before the Cloud
      # Run deploy so the schema is ready before the new revision serves; a failure blocks the deploy.
      - name: Sync database schema (prisma db push)
        run: bash scripts/db-push-prod.sh

      - name: Build and push image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          # NEXT_PUBLIC_* is inlined at build time — enable the embedded assistant widget in the image.
          docker build --build-arg NEXT_PUBLIC_ASSISTANT_ENABLED=true --build-arg NEXT_PUBLIC_ENTERPRISE_ASSISTANT_ENABLED=true -t "${IMAGE_URI}" apps/web
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      # Cloud Run --set-env-vars / --set-secrets REPLACE the full set, so the embedded assistant
      # config must live here. Non-secret: service URL, the backend session client id, the delegation
      # client id, and the platform issuer. Secrets (GCP Secret Manager): the session client secret and
      # the delegation client secret (its value must equal the Noodle-side TIVMARK_DELEG_CLIENT_SECRET).
      # Deployed with --no-traffic behind the `candidate` tag so the smoke test below can exercise the
      # real revision — same image, env vars, secrets and Cloud SQL socket — while live traffic stays
      # on the previous one. Nothing here shifts traffic; the "Route traffic" step does that, and only
      # after the smoke test passes.
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_URI}" \
            --platform managed \
            --no-invoker-iam-check \
            --no-traffic \
            --tag candidate \
            --port 4002 \
            --add-cloudsql-instances "${CLOUD_SQL_CONNECTION_NAME}" \
            --set-env-vars "NEXTAUTH_URL=https://app.tivmark.com,APP_URL=https://app.tivmark.com,NEXTAUTH_SESSION_STRATEGY=jwt,AUTH_PROVIDERS=credentials,HIDE_LANDING_PAGE=false,FEATURE_TEAM_WEBHOOK=false,FEATURE_TEAM_PAYMENTS=false,NOODLE_ASSISTANT_SERVICE_URL=https://cloud.noodleseed.dev,NOODLE_ASSISTANT_CLIENT_ID=embed_0b8a5f33-1bf3-4d65-99bb-2853142e664e,ASSISTANT_DELEG_CLIENT_ID=tivmark-assistant-deleg,NOODLE_PLATFORM_ISSUER=https://cloud.noodleseed.dev,ONBOARDING_RESEARCH_PROJECT=${GCP_PROJECT_ID},ONBOARDING_RESEARCH_QUEUE=${ONBOARDING_RESEARCH_QUEUE},ONBOARDING_RESEARCH_SERVICE_ACCOUNT=${ONBOARDING_RESEARCH_SERVICE_ACCOUNT},ONBOARDING_RESEARCH_MODEL=${ONBOARDING_RESEARCH_MODEL}" \
            --set-secrets "DATABASE_URL=database-url:latest,NEXTAUTH_SECRET=nextauth-secret:latest,OAUTH_PRIVATE_JWK=oauth-private-jwk:latest,NOODLE_ASSISTANT_CLIENT_SECRET=noodle-assistant-client-secret:latest,ASSISTANT_DELEG_CLIENT_SECRET=assistant-deleg-client-secret:latest"

      # A green build does not mean a working app. `npm run build-ci` compiles, and Cloud Run's health
      # check only requires the container to bind its port — both pass while every request 500s. That is
      # exactly how revision 00054 shipped a fully broken app that stayed down for ~24h: a runtime
      # MODULE_NOT_FOUND on a dependency the Next file tracer failed to copy into the standalone output.
      # So probe the running revision over HTTP before it can serve anyone.
      #
      # `/api/health` runs a real query through Prisma and the Cloud SQL socket; `/` server-renders a
      # page. Together they cover the DB path and the render path, and either one would have caught
      # 00054. A non-200 from either leaves traffic on the previous revision and fails the deploy.
      - name: Smoke test candidate revision
        run: |
          set -uo pipefail
          CANDIDATE_URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format=json | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"

          if [ -z "${CANDIDATE_URL}" ] || [ "${CANDIDATE_URL}" = "null" ]; then
            echo "::error::Could not resolve the candidate tag URL; refusing to route traffic."
            exit 1
          fi
          echo "Probing ${CANDIDATE_URL}"

          probe() {
            path="$1"
            # Retry only to absorb cold start. A settled non-200 is a failure, not something to wait out.
            for attempt in $(seq 1 10); do
              code="$(curl -sS -o /tmp/smoke-body -w '%{http_code}' --max-time 30 "${CANDIDATE_URL}${path}" || echo 000)"
              if [ "${code}" = "200" ]; then
                echo "  ${path} -> 200"
                return 0
              fi
              echo "  ${path} -> ${code} (attempt ${attempt}/10)"
              sleep 10
            done
            echo "::error::Smoke test failed: ${path} returned ${code}, expected 200."
            echo "--- response body ---"
            head -c 2000 /tmp/smoke-body || true
            echo
            echo "--- candidate revision stderr ---"
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"${SERVICE_NAME}\" AND logName:\"stderr\"" \
              --project "${GCP_PROJECT_ID}" --limit 50 --freshness=10m \
              --format="value(textPayload)" || true
            return 1
          }

          probe /api/health || exit 1
          probe / || exit 1
          echo "Smoke test passed."

      # Only now does the new revision serve users. Also drops the `candidate` tag so its URL does not
      # linger as a second public entry point to the revision.
      - name: Route traffic to verified revision
        run: |
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --to-latest \
            --remove-tags candidate

      # Guards the routing step itself: the smoke test proved the revision works, this proves the
      # traffic split actually points at it.
      - name: Verify live service
        run: |
          set -uo pipefail
          for attempt in $(seq 1 6); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://app.tivmark.com/api/health || echo 000)"
            if [ "${code}" = "200" ]; then
              echo "https://app.tivmark.com/api/health -> 200"
              exit 0
            fi
            echo "https://app.tivmark.com/api/health -> ${code} (attempt ${attempt}/6)"
            sleep 10
          done
          echo "::error::Live service is not healthy after routing traffic."
          exit 1
