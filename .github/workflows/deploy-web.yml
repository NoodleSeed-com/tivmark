name: Deploy web to GCP

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: tivmark-app
  GCP_REGION: us-central1
  ARTIFACT_REPOSITORY: tivmark
  SERVICE_NAME: tivmark-web
  IMAGE_NAME: web
  CLOUD_SQL_CONNECTION_NAME: tivmark-app:us-central1:tivmark-app-db

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 to match the Docker runtime (node:24-alpine).
          node-version: 24
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
          check-latest: true

      - name: Validate web app
        working-directory: apps/web
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          NEXTAUTH_URL: http://localhost:4002
          NEXTAUTH_SECRET: secret
          NEXTAUTH_SESSION_STRATEGY: jwt
          APP_URL: http://localhost:4002
        run: |
          npm ci
          npm run check-lint
          npm run check-format
          npm run check-locale
          npm run check-api-first
          npm run openapi:check
          npm run test
          npm run build-ci

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      # Apply schema.prisma to the prod Cloud SQL DB. This repo manages schema via `db push`
      # (prisma/migrations/ is frozen at 2024), and nothing else in the deploy path syncs the DB —
      # so without this a new model 500s in prod with "table does not exist". Runs before the Cloud
      # Run deploy so the schema is ready before the new revision serves; a failure blocks the deploy.
      - name: Sync database schema (prisma db push)
        run: bash scripts/db-push-prod.sh

      - name: Build and push image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          # NEXT_PUBLIC_* is inlined at build time — enable the embedded assistant widget in the image.
          docker build --build-arg NEXT_PUBLIC_ASSISTANT_ENABLED=true -t "${IMAGE_URI}" apps/web
          docker push "${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      # Cloud Run --set-env-vars / --set-secrets REPLACE the full set, so the embedded assistant
      # config must live here. Non-secret: service URL, the backend session client id, the delegation
      # client id, and the platform issuer. Secrets (GCP Secret Manager): the session client secret and
      # the delegation client secret (its value must equal the Noodle-side TIVMARK_DELEG_CLIENT_SECRET).
      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${IMAGE_URI}" \
            --platform managed \
            --no-invoker-iam-check \
            --port 4002 \
            --add-cloudsql-instances "${CLOUD_SQL_CONNECTION_NAME}" \
            --set-env-vars "NEXTAUTH_URL=https://app.tivmark.com,APP_URL=https://app.tivmark.com,NEXTAUTH_SESSION_STRATEGY=jwt,AUTH_PROVIDERS=credentials,HIDE_LANDING_PAGE=false,FEATURE_TEAM_WEBHOOK=false,FEATURE_TEAM_PAYMENTS=false,NOODLE_ASSISTANT_SERVICE_URL=https://cloud.noodleseed.dev,NOODLE_ASSISTANT_CLIENT_ID=embed_0b8a5f33-1bf3-4d65-99bb-2853142e664e,ASSISTANT_DELEG_CLIENT_ID=tivmark-assistant-deleg,NOODLE_PLATFORM_ISSUER=https://cloud.noodleseed.dev" \
            --set-secrets "DATABASE_URL=database-url:latest,NEXTAUTH_SECRET=nextauth-secret:latest,OAUTH_PRIVATE_JWK=oauth-private-jwk:latest,NOODLE_ASSISTANT_CLIENT_SECRET=noodle-assistant-client-secret:latest,ASSISTANT_DELEG_CLIENT_SECRET=assistant-deleg-client-secret:latest"
